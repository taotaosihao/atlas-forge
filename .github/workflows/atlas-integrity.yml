name: Atlas integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  manifest-release-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate manifest and release identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          node --check workflow/bin/atlas-plugin-integrity
          workflow/bin/atlas-plugin-integrity \
            manifest \
            --plugin-root plugins/atlas-workflow

          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) base="" ;;
          esac
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -n "$base" ]]; then
            git cat-file -e "$base^{commit}"
            workflow/bin/atlas-plugin-integrity \
              release \
              --repo "$GITHUB_WORKSPACE" \
              --base "$base"
          else
            test "$(git rev-list --count HEAD)" -eq 1
            printf 'root commit: release comparison has no predecessor\n'
          fi

          bash workflow/tests/contract_atlas_plugin_integrity.sh

  repo-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep strace

      - name: Verify hermetic repository contract
        run: |
          set -euo pipefail
          command -v rsync
          command -v strace
          bash workflow/tests/contract_repo.sh

  host-layout-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ATLAS_REAL_CLI_E2E: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep

      - name: Verify isolated host layouts
        run: bash workflow/tests/contract_host_install.sh

  source-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes shellcheck

      - name: Lint tracked shell and JavaScript sources
        run: bash scripts/lint-sources.sh

  docs-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate contract index and relative Markdown links
        run: |
          set -euo pipefail
          node plugins/atlas-workflow/scripts/codex-contract-index-lint \
            --root docs/atlas-workflow/20260710-003-atlas-forge-release-integrity-governance-plan
          scripts/check-relative-markdown-links.py --root .
